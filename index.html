<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .pokédex-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .pokédex-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff0000;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-input {
            padding: 14px 16px;
            font-size: 1rem;
            border: 2px solid #ffffff;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a1a;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .search-input:focus {
            outline: none;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .search-input::placeholder {
            color: #999;
        }

        .search-button {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
        }

        .search-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.4);
        }

        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-area {
            margin-top: 40px;
            min-height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .results-area.active {
            border-color: #ff0000;
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.2);
        }

        .results-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .results-placeholder svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .results-placeholder p {
            font-size: 0.95rem;
        }

        .pokemon-card {
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pokemon-image-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ff0000;
        }

        .pokemon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .pokemon-name {
            color: #ff0000;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .pokemon-id {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .pokemon-types {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .type-badge {
            background: #ff0000;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.95rem;
            text-align: center;
            padding: 20px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: rgba(255, 107, 107, 0.1);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ff0000;
            font-weight: 600;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 0, 0, 0.3);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .pokédex-title {
                font-size: 2.5rem;
            }

            .search-container {
                padding: 20px;
            }

            .results-area {
                padding: 20px;
                min-height: 250px;
            }

            .pokemon-image-container {
                width: 120px;
                height: 120px;
            }

            .pokemon-name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pokédex-header">
            <h1 class="pokédex-title">Pokédex</h1>
            <p class="subtitle">Search Your Favorite Pokémon</p>
        </div>

        <div class="search-container">
            <div class="input-group">
                <input 
                    type="text" 
                    class="search-input" 
                    id="pokemonInput" 
                    placeholder="Enter Pokémon name or ID..."
                    autocomplete="off"
                >
            </div>
            <button class="search-button" id="searchBtn">Search</button>
        </div>

        <div class="results-area" id="resultsArea">
            <div class="results-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <p>Search for a Pokémon to get started!</p>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('pokemonInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsArea = document.getElementById('resultsArea');

        // Search on button click
        searchBtn.addEventListener('click', searchPokemon);

        // Search on Enter key press
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchPokemon();
            }
        });

        async function searchPokemon() {
            const query = searchInput.value.trim();

            if (!query) {
                showError('Please enter a Pokémon name or ID');
                return;
            }

            showLoading();

            try {
                const response = await fetch(
                    `https://pokeapi.co/api/v2/pokemon/${query.toLowerCase()}`
                );

                if (!response.ok) {
                    throw new Error('Pokémon not found');
                }

                const data = await response.json();
                displayPokemon(data);
            } catch (error) {
                showError(`Could not find "${query}". Please check the name and try again!`);
            }
        }

        function displayPokemon(pokemon) {
            const types = pokemon.types
                .map(typeInfo => typeInfo.type.name)
                .join(', ');

            const imageUrl = pokemon.sprites.other['official-artwork'].front_default || 
                           pokemon.sprites.front_default;

            resultsArea.classList.add('active');
            resultsArea.innerHTML = `
                <div class="pokemon-card">
                    <div class="pokemon-image-container">
                        <img 
                            src="${imageUrl}" 
                            alt="${pokemon.name}" 
                            class="pokemon-image"
                        >
                    </div>
                    <div class="pokemon-name">${pokemon.name}</div>
                    <div class="pokemon-id">#${String(pokemon.id).padStart(3, '0')}</div>
                    <div class="pokemon-types">
                        ${pokemon.types
                            .map(typeInfo => `<div class="type-badge">${typeInfo.type.name}</div>`)
                            .join('')
                        }
                    </div>
                </div>
            `;
        }

        function showLoading() {
            resultsArea.classList.add('active');
            resultsArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Searching...</span>
                </div>
            `;
        }

        function showError(message) {
            resultsArea.classList.remove('active');
            resultsArea.innerHTML = `<div class="error-message">${message}</div>`;
        }
    </script>
</body>
</html>
